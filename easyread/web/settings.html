<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定 · NewsRead</title>
<link rel="icon" href="/web/paperread-mark.png" type="image/png">
<link rel="stylesheet" href="/web/css/newsread.css">
<script>try{var p=JSON.parse((localStorage.getItem("easyread-prefs")||localStorage.getItem("coread-prefs"))||"{}");var d=p.theme==="dark"||(p.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light"}catch(e){}</script>
</head>
<body>
<header class="appbar">
  <a class="brand" href="/"><span class="mark">N</span>NewsRead</a>
  <nav class="nav"><a href="/">資料庫</a><a href="/entities">追蹤對象</a><a href="/settings" aria-current="page">設定</a></nav>
  <span class="spacer"></span>
  <span id="themeSlot" hidden></span>
</header>

<main class="page">
  <div class="page-head"><h1>設定</h1></div>
  <div class="layout">
    <nav class="toc" aria-label="設定分類"><a href="#models">AI 模型</a></nav>
    <div>
      <section class="card sec" id="models">
        <h2>AI 模型</h2>
        <p class="muted">打開就自動找這台電腦上已登入的 AI 訂閱；也可以自己填 API key。沒有任何 AI 時，閱讀、筆記、帳本照常能用，只是不會分類、翻譯、起草。</p>
        <div id="view"></div>
      </section>
    </div>
  </div>
</main>
<div id="toast" role="status"></div>

<script src="/web/js/common/desktop-bridge.js"></script>
<script src="/web/js/common/i18n.js"></script>
<script src="/web/js/common/util.js"></script>
<script src="/web/js/common/theme.js"></script>
<script src="/web/js/settings/app.js"></script>
</body>
</html>
