  <span class="date"><time datetime="2026-11-10 13:30">2026/11/10 13:30</time></span>
  <p>（範例）範例記憶體廠公布十月營收，比上個月增加一成二，比去年同期增加四成五，創下單月新高。</p>
  <p>（範例）公司表示，伺服器用的高頻寬記憶體出貨持續增加，產品價格也比上一季調漲。</p>
  <p>（範例）市場預期第四季營收可望再成長，但要留意消費性電子需求仍然疲弱。</p>
